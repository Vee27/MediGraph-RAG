services:

  # Service 1: Ollama (the AI model server)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Service 2: Your FastAPI app
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    volumes:
      - .:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/
      dockerfile: ../../docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    depends_on:
      - app

# Define the named volume for Ollama models
volumes:
  ollama_data: