services:

  # Service 1: Ollama (the AI model server)
  ollama:
    image: ollama/ollama          # Use the official Ollama image
    container_name: medigraph-ollama
    ports:
      - "11435:11435"             # Expose Ollama on your laptop too
    volumes:
      - ollama_data:/root/.ollama # Save downloaded models here permanently

  # Service 2: Your FastAPI app
  app:
    build:
      context: .                  # Build using the current folder
      dockerfile: docker/Dockerfile
    container_name: medigraph-app
    ports:
      - "8000:8000"               # Your app is available at localhost:8000
    environment:
      - OLLAMA_BASE_URL=http://ollama:11435   # ← KEY: use service name, not localhost
      - OLLAMA_CHAT_MODEL=phi3:mini
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - APP_ENV=development
      - LOG_LEVEL=INFO
    depends_on:
      - ollama                    # Start Ollama first, then the app
    volumes:
      - .:/app                    # Mount your code so changes reflect immediately

# Define the named volume for Ollama models
volumes:
  ollama_data: